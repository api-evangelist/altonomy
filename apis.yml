name: Altonomy
description: 'Altonomy is a digital-asset trading, market-making, and OTC firm founded in 2018 and
  headquartered in Singapore, with additional offices in New York City and Shenzhen. The firm provides
  24/7 over-the-counter transaction services for crypto-to-fiat and crypto-to-crypto trades, deep
  liquidity coverage for illiquid tokens, and institutional-grade advisory and asset-management
  solutions across proprietary trading, mining, and venture capital. Its proprietary Hybrid IQ
  methodology pairs discretionary crypto-market experience with market-making algorithms to deliver
  order-book depth and tight spreads. Altonomy is also a data provider to the Pyth Network. In 2022,
  Blockchain.com acquired Altonomy''s OTC trading desk; Altonomy continues to operate its other lines
  of business. Altonomy publishes no public developer API or documentation surface; this profile is a
  company/provider identity record in the API Evangelist network.'
